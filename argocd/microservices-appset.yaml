# Human-in-the-Loop Gate #2:
# - 'dev' apps use automated sync (prune + selfHeal) for rapid iteration.
# - 'prod' apps omit 'automated' syncPolicy, requiring a human operator to approve
#   the live diff in the Argo CD UI (https://localhost:8075) or via 'argocd app sync'.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microservices
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: dev
                  branch: dev
                  clusterName: dev-cluster
                - env: prod
                  branch: prod
                  clusterName: prod-cluster
          - list:
              elements:
                - service: orders
                - service: payments
                - service: inventory
  template:
    metadata:
      name: "{{.service}}-api-{{.env}}"
    spec:
      project: default
      source:
        repoURL: http://gitea:3000/platform/gitops-repo.git
        targetRevision: "{{.branch}}"
        path: "k8s/overlays/{{.env}}/{{.service}}"
      destination:
        name: "{{.clusterName}}"
        namespace: "{{.env}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if eq .env "dev" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
