apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../../base/inventory

replicas:
  - name: inventory-api
    count: 1

images:
  - name: inventory-api
    newName: harbor.orb.local:8085/dev/inventory-api
    newTag: "1.0.0"

patches:
  - target:
      kind: Deployment
      name: inventory-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inventory-api
      spec:
        template:
          spec:
            containers:
              - name: inventory-api
                env:
                  - name: LOG_LEVEL
                    value: debug
