# Ansible Inventory for Local Platform Engineering Lab (Ubuntu Host)
#
# Run via uv (ephemeral isolated environment, no global Ansible install needed):
#
# Option A — From your Mac targeting a remote Ubuntu server over SSH:
#   1. Uncomment/set your Ubuntu server IP and SSH user under [ubuntu_lab] below
#   2. Run:
#      uv run --with ansible-core ansible-playbook -i ansible/inventory.ini -l ubuntu_lab ansible/playbook.yml --ask-become-pass
#   (Or pass the host ad-hoc without editing this file:
#      uv run --with ansible-core ansible-playbook -i "luis@<UBUNTU_IP>," ansible/playbook.yml --ask-become-pass)
#
# Option B — Directly on the Ubuntu machine itself:
#   uv run --with ansible-core ansible-playbook -i ansible/inventory.ini -l local ansible/playbook.yml --ask-become-pass

# Option C — Against the local Lima Ubuntu 26.04 LTS Server VM (beelink.yaml):
#   uv run --with ansible-core ansible-playbook -i ansible/inventory.ini -l lima ansible/playbook.yml

[local]
localhost ansible_connection=local

[lima]
lima-beelink ansible_ssh_common_args="-F ~/.lima/beelink/ssh.config"

[ubuntu_lab]
# Example: Beelink SER9 or Ubuntu home lab server on your LAN
# 192.168.1.50 ansible_user=luis
