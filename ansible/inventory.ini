# Ansible Inventory for Local Platform Engineering Lab (Ubuntu Host)
#
# Usage Option A — Run directly on the Ubuntu machine itself:
#   ansible-playbook -i ansible/inventory.ini -l local ansible/playbook.yml --ask-become-pass
#
# Usage Option B — Run remotely from your Mac targeting an Ubuntu machine over SSH:
#   1. Update the IP/hostname and SSH user under [ubuntu_lab] below
#   2. Run: ansible-playbook -i ansible/inventory.ini -l ubuntu_lab ansible/playbook.yml --ask-become-pass

[local]
localhost ansible_connection=local

[ubuntu_lab]
# Example: Beelink SER9 or Ubuntu home lab server on your LAN
# 192.168.1.50 ansible_user=luis
